name: ci

# PR 게이트 (08 §6): 초록이 아니면 머지하지 않는다.
# 크롤러·백업·리마인드 워크플로우와는 별개다.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # 빌드·타입체크는 실제 DB에 붙지 않는다. Prisma가 요구하는 형식만 맞춘 더미 값이며
      # 시크릿이 아니다. 실제 값은 Vercel 환경변수 / Actions Secrets에만 둔다.
      DATABASE_URL: postgresql://user:password@localhost:6543/postgres?pgbouncer=true
      DIRECT_URL: postgresql://user:password@localhost:5432/postgres
      # Supabase Auth도 형식만 맞춘 더미다. 빌드는 실제 인증 서버에 붙지 않는다
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      ADMIN_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: install
        run: npm ci

      - name: prisma generate
        run: npm run db:generate

      # next typegen이 .next/types의 PageProps/LayoutProps를 만든다 — typecheck 선행 조건
      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npx biome ci .

      - name: test
        run: npm run test

      - name: build
        run: npm run build

      # CI가 끝나면 Slack으로 결과를 보낸다. 성공·실패 둘 다 보낸다(요청).
      #
      # 06 §1.1은 "웹훅 시크릿은 Vercel env에만"이지만, 그건 **크롤러 러너**에 자격증명을
      # 두지 않겠다는 규칙이다. CI는 DB도 토큰도 만지지 않고, 알려야 할 대상이 앱이 아니라
      # 이 워크플로우 자신이라 서버를 경유할 길이 없다 — 그래서 여기만 예외로 둔다.
      #
      # cancelled()는 제외한다. concurrency.cancel-in-progress 때문에 연속 푸시마다
      # 취소가 나고, 그건 "다 돈" 결과가 아니다.
      #
      # 알림 실패가 CI 결과를 바꾸지 않는다(lib/notify/slack.ts와 같은 원칙).
      - name: notify slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 커밋 제목·PR 제목은 사람이 쓴 값이다. ${{ }}로 셸에 박으면 스크립트 주입이
          # 되므로 반드시 env를 거쳐 "$VAR"로만 읽는다
          CI_STATUS: ${{ job.status }}
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # PR 이벤트에서만 채워진다. main push에는 머지할 대상이 없다
          CI_PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — 알림을 건너뜁니다"
            exit 0
          fi

          # 통과한 PR에서 다음 행동은 로그를 여는 게 아니라 머지다 — 링크를 거기로 보낸다.
          # 실패는 반대로 로그를 봐야 하고, main push는 이미 머지된 뒤라 할 일이 없다
          if [ "$CI_STATUS" = "success" ]; then
            icon="🟢"; label="CI 통과"
            if [ -n "$CI_PR_URL" ]; then
              link="<$CI_PR_URL|Merge 하러 가기>"
            else
              link="<$CI_URL|실행 보기>"
            fi
          else
            icon="🔴"; label="CI 실패"
            link="<$CI_URL|실행 보기>"
          fi

          # 커밋 메시지는 여러 줄일 수 있다. 제목 줄만 쓴다
          title=$(printf '%s' "$CI_TITLE" | head -n 1)

          # 제목에 따옴표·백슬래시가 있어도 깨지지 않게 jq로 만든다
          jq -n --arg text "$icon $label · $CI_BRANCH · $title · $link" '{text: $text}' \
            | curl -sS --max-time 5 -X POST -H 'content-type: application/json' -d @- "$SLACK_WEBHOOK_URL"
